[package]
name = "pgroove-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
dirs = "7"
flate2 = "1"
futures-util = "0.3.34"
keyring-core = "1"
log.workspace = true
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlformat = "0.5"
tar = "0.4"
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
tokio-postgres.workspace = true
tokio-postgres-rustls = "0.14"
toml = "1"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
