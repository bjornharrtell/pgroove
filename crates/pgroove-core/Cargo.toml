[package]
name = "pgroove-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
dirs = "6"
log.workspace = true
serde_json = "1"
sqlformat = "0.5"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
tokio-postgres = "0.7"
toml = "0.9"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
percent-encoding = "2"
rustls-native-certs = "0.8.5"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
