name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            ext: tar.gz
          # Apple silicon only; macos-latest runners are arm64.
          - os: macos-latest
            name: macos-aarch64
            ext: tar.gz
          - os: windows-latest
            name: windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libvulkan-dev libfontconfig-dev
      - run: cargo build --release -p pgroove-app
      - name: Package (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/pgroove README.md dist/
          cp packaging/pgroove.desktop dist/
          tar -C dist -czf pgroove-${{ github.ref_name }}-${{ matrix.name }}.tar.gz .
      # An unsigned .app in a .dmg for people, and a tarball of the same .app for the updater.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: sh packaging/build-macos-app.sh "${GITHUB_REF_NAME#v}" pgroove-${{ github.ref_name }}-${{ matrix.name }}
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/pgroove.exe, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath pgroove-${{ github.ref_name }}-${{ matrix.name }}.zip
      - name: AppImage
        if: runner.os == 'Linux'
        run: sh packaging/build-appimage.sh pgroove-${{ github.ref_name }}-x86_64.AppImage
      # The in-app updater refuses to install an asset without a matching .sha256 file.
      - name: Checksums (unix)
        if: runner.os != 'Windows'
        run: |
          for f in pgroove-*.tar.gz pgroove-*.AppImage pgroove-*.dmg; do
            [ -f "$f" ] && shasum -a 256 "$f" > "$f.sha256"
          done
          ls pgroove-*
      - name: Checksums (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem pgroove-*.zip) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: |
            pgroove-*.tar.gz
            pgroove-*.tar.gz.sha256
            pgroove-*.zip
            pgroove-*.zip.sha256
            pgroove-*.dmg
            pgroove-*.dmg.sha256
            pgroove-*.AppImage
            pgroove-*.AppImage.sha256
          if-no-files-found: error

  # One job publishes the release so the notes are written once for all platforms.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Release notes from commit messages
        run: bash packaging/release-notes.sh "${{ github.ref_name }}" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
          # A tag like v1.0.0-rc.1 is published as a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
